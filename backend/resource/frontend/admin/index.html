<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherVisuals — Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">AetherVisuals</span>
      </div>
      <h2>Admin Login</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit" id="login-btn">Sign In</button>
        <p id="login-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">AetherVisuals</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" id="nav-companies">Companies</a>
        <a href="#" class="nav-item" id="nav-logs">Access Logs</a>
      </nav>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </aside>

    <main class="main-content">
      <div id="breadcrumb" class="breadcrumb">Home</div>

      <!-- COMPANIES VIEW -->
      <div id="view-companies">
        <div class="action-bar">
          <h2>Companies</h2>
          <button id="btn-new-company" class="btn-primary">+ New Company</button>
        </div>
        <div id="companies-list" class="card-grid"></div>
      </div>

      <!-- FOLDERS VIEW -->
      <div id="view-folders" class="hidden">
        <div class="action-bar">
          <h2 id="folders-title">Folders</h2>
          <div class="action-group">
            <button id="btn-company-link" class="btn-secondary">Get Company Link</button>
            <button id="btn-new-folder" class="btn-primary">+ New Folder</button>
          </div>
        </div>
        <div id="folders-list" class="card-grid"></div>
      </div>

      <!-- ASSETS VIEW -->
      <div id="view-assets" class="hidden">
        <div class="action-bar">
          <h2 id="assets-title">Assets</h2>
          <div class="action-group">
            <button id="btn-folder-link" class="btn-secondary">Get Folder Link</button>
          </div>
        </div>
        <div id="drop-zone" class="drop-zone">
          <p>Drag & drop files here, or <label for="file-input" class="file-label">browse</label></p>
          <input type="file" id="file-input" multiple class="hidden" />
          <div id="upload-progress" class="upload-progress hidden">
            <div id="progress-bar" class="progress-bar"></div>
            <span id="progress-text">Uploading...</span>
          </div>
        </div>
        <div id="assets-list" class="asset-grid"></div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-confirm" class="btn-primary">Confirm</button>
        <button id="modal-cancel" class="btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <!-- LINK MODAL -->
  <div id="link-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h3>Sharing Link</h3>
      <div class="link-display">
        <input type="text" id="link-output" readonly />
        <button id="btn-copy-link" class="btn-secondary">Copy</button>
      </div>
      <div class="modal-actions">
        <button id="btn-regen-link" class="btn-danger">Regenerate Link</button>
        <button id="link-modal-close" class="btn-ghost">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/links.js"></script>
  <script src="/admin/js/companies.js"></script>
  <script src="/admin/js/folders.js"></script>
  <script src="/admin/js/upload.js"></script>
</body>
</html>
